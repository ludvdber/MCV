# Mars Climate Viewer — bloc serveur Nginx (variante A de deploy/mcv.service :
# le proxy et l'application sont sur la meme machine).
#
#   sudo cp deploy/nginx-mcv.conf /etc/nginx/sites-available/mcv
#   sudo ln -s /etc/nginx/sites-available/mcv /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le certificat s'obtient ensuite avec : sudo certbot --nginx -d mars.exemple.be

server {
    listen 80;
    listen [::]:80;
    server_name mars.exemple.be;

    # L'application envoie un en-tete HSTS d'un an. Il ne veut rien dire tant
    # que le HTTP ne mene pas au HTTPS : cette redirection n'est pas cosmetique.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mars.exemple.be;

    ssl_certificate     /etc/letsencrypt/live/mars.exemple.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mars.exemple.be/privkey.pem;

    # Les exports NetCDF et l'animation (48 images lues sur disque) peuvent
    # depasser la minute par defaut sur un stockage lent.
    proxy_read_timeout 120s;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # $proxy_add_x_forwarded_for AJOUTE la vraie IP a la suite de ce que le
        # client avait envoye, au lieu de le remplacer. C'est la forme la plus
        # repandue et elle convient : la valve de Tomcat lit la liste de droite
        # a gauche, donc elle retient la valeur ajoutee ici, pas celle du client.
        # $remote_addr fait aussi bien si tu preferes une valeur propre.
    }

    # -----------------------------------------------------------------------
    # Trois pieges qui defont, cote proxy, ce qui a ete corrige cote application.
    # Ce sont des choses a NE PAS ajouter ; elles sont ecrites ici parce qu'on
    # les rencontre dans beaucoup de configurations recopiees.
    # -----------------------------------------------------------------------
    #
    # 1. N'ajoute PAS de directive de cache globale :
    #        expires 30d;
    #        add_header Cache-Control "public, max-age=2592000";
    #    MCV decide deja par chemin. Les fichiers a empreinte partent pour un an,
    #    mais index.html, sw.js et theme-init.js doivent rester en no-cache. Une
    #    regle globale les figerait, et une mise en ligne n'atteindrait plus
    #    jamais un visiteur deja venu.
    #
    # 2. N'ajoute PAS :
    #        proxy_set_header Accept-Encoding "";
    #    On la trouve dans les configurations qui utilisent sub_filter. Elle
    #    empeche l'application de compresser : le bundle JavaScript repasse de
    #    390 Ko a 1150 Ko, sans le moindre message d'erreur.
    #
    # 3. Attention a add_header : dans Nginx, ajouter un seul add_header dans un
    #    bloc ANNULE tous ceux herites du bloc parent. L'application envoie deja
    #    sa politique de securite complete (CSP, HSTS, nosniff, Referrer-Policy) ;
    #    la dupliquer ici est inutile, et le faire a moitie est risque.
}
