# ---------------------------------------------------------------------------
# Trois pieges qui defont, cote proxy, ce qui a ete corrige cote application.
# Ce sont des choses a NE PAS ajouter ; elles sont ecrites ici parce qu'on
# les rencontre dans beaucoup de configurations recopiees.
# ---------------------------------------------------------------------------
#
# 1. N'ajoute PAS de directive de cache globale :
#        expires 30d;
#        add_header Cache-Control "public, max-age=2592000";
#    MCV decide deja par chemin. Les fichiers a empreinte partent pour un an,
#    mais index.html, sw.js et theme-init.js doivent rester en no-cache. Une
#    regle globale les figerait, et une mise en ligne n'atteindrait plus
#    jamais un visiteur deja venu.
#
# 2. N'ajoute PAS :
#        proxy_set_header Accept-Encoding "";
#    On la trouve dans les configurations qui utilisent sub_filter. Elle
#    empeche l'application de compresser : le bundle JavaScript repasse de
#    390 Ko a 1150 Ko, sans le moindre message d'erreur.
#
# 3. Attention a add_header : dans Nginx, ajouter un seul add_header dans un
#    bloc ANNULE tous ceux herites du bloc parent. L'application envoie deja
#    sa politique de securite complete (CSP, HSTS, nosniff, Referrer-Policy) ;
#    la dupliquer ici est inutile, et le faire a moitie est risque.
