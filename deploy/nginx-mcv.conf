# Mars Climate Viewer — bloc serveur Nginx (variante A de deploy/mcv.service :
# le proxy et l'application sont sur la meme machine).
#
# ORDRE D'INSTALLATION — il compte.
#
#   1. sudo mkdir -p /var/www/certbot
#   2. sudo cp deploy/nginx-mcv.conf /etc/nginx/sites-available/mcv
#   3. sudo nano /etc/nginx/sites-available/mcv     # remplacer mars.exemple.be
#   4. sudo ln -s /etc/nginx/sites-available/mcv /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo certbot --nginx -d mars.exemple.be
#   7. decommenter le bloc 443 ci-dessous, puis nginx -t && systemctl reload nginx
#
# Le bloc HTTPS est livre COMMENTE, et ce n'est pas de la prudence excessive :
# une directive ssl_certificate qui pointe vers un fichier absent fait echouer
# nginx -t avec « cannot load certificate ... No such file or directory », et
# nginx refuse de recharger. Or les certificats n'existent qu'apres l'etape 6.
# Servir le bloc 443 avant d'avoir le certificat rendait donc les etapes 5 et 6
# impossibles a enchainer telles qu'elles etaient ecrites.

server {
    listen 80;
    listen [::]:80;
    server_name mars.exemple.be;

    # Le defi ACME doit passer AVANT la redirection.
    #
    # Attention au piege : un « return 301 » place directement dans le bloc
    # server s'execute pendant la phase de reecriture, donc AVANT que nginx
    # choisisse une location. Il court-circuite tout, y compris cette location,
    # et le renouvellement automatique du certificat echoue silencieusement
    # trois mois plus tard. La redirection doit donc vivre dans une location,
    # pas au niveau du serveur.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # L'application envoie un en-tete HSTS d'un an. Il ne veut rien dire tant
    # que le HTTP ne mene pas au HTTPS : cette redirection n'est pas cosmetique.
    location / {
        return 301 https://$host$request_uri;
    }
}

