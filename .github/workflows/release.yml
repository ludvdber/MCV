# Release de MCV : le JAR est construit ICI, plus sur un poste.
#
# Un JAR construit a la main depend de la machine qui le produit, rien ne
# garantit que le tag pointe sur le commit reellement construit, et rien ne
# prouve a celui qui le telecharge que le fichier sort de ce code. Construit
# par GitHub a partir du depot, il porte une attestation de provenance signee
# (Sigstore) : qui la verifie sait de quel depot, de quel commit et de quel
# workflow il sort. C'est ce qui tient lieu de signature, que le projet n'a
# pas. Les fichiers de deploiement joints sont attestes avec lui.
#
# Tout se fait depuis le site GitHub, sans ligne de commande :
# Actions -> release -> Run workflow.
#   - case « Creer la release » decochee : build d'essai, fichiers joints au
#     run, sans attestation ni release. A faire en premier.
#   - cochee : build, attestation, release en BROUILLON nommee d'apres la
#     version de build.gradle. Le tag n'existe pas encore : GitHub le cree sur
#     le commit construit au moment de « Publish release ». Rien n'est public
#     avant.
# Pas de declenchement sur tag : publier le brouillon CREE le tag, et ce tag
# relancerait un second build qui echouerait sur une release deja existante.
name: release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Creer la release (brouillon) - sinon simple build d'essai"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write           # creer la release en brouillon
      id-token: write           # signer l'attestation (Sigstore)
      attestations: write       # l'enregistrer aupres de GitHub
      artifact-metadata: write  # demande par actions/attest v4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le wrapper est un binaire du depot qu'on s'apprete a EXECUTER : on
      # verifie son empreinte contre celles publiees par Gradle avant tout.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # La version se LIT dans build.gradle, elle ne se saisit pas : un tag
      # tape a la main pourrait annoncer une autre version que le JAR. Les
      # verifications qui ne coutent rien tournent aussi en essai, pour qu'un
      # oubli se voie avant le vrai lancement.
      - name: Version a publier
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CREER: ${{ inputs.release }}
        run: |
          # build.gradle l'exige en commentaire : deux numeros differents dans
          # un seul livrable, c'est deux versions qui coexistent. Et les notes
          # de la release SONT la section du CHANGELOG : une seule source, donc
          # pas de release sans entree.
          version=$(python3 .github/scripts/version.py) || exit 1
          tag="v$version"
          if [ "$CREER" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::Une release se construit depuis master (lance depuis $GITHUB_REF)"; exit 1
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::La release $tag existe deja : monter la version"; exit 1
            fi
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::Le tag $tag existe deja : monter la version"; exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Pas de cache ici, ni npm ni Gradle : un JAR publie se construit sur des
      # paquets telecharges pour lui, pas sur un cache partage avec d'autres
      # runs, qui pourrait avoir ete ecrit par une branche quelconque.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      # `npm ci` installe EXACTEMENT le lockfile. La tache Gradle npmInstall
      # lance ensuite `npm install`, qui ne change rien sur un lockfile
      # coherent : c'est verifie plus bas.
      - name: Dependances du frontend
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # Les memes portes que la CI : on ne publie pas un commit qu'on n'a pas
      # vu passer ses tests, meme si la CI l'a vu avant.
      - name: Lint et tests du frontend
        working-directory: frontend
        run: |
          npm run lint
          npx vitest run

      # Le depot est developpe sous Windows : gradlew est enregistre sans bit
      # d'execution (voir ci.yml).
      - name: Tests du backend et JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      # Le JAR doit avoir ete construit sur les dependances COMMITEES, pas sur
      # ce que `npm install` aurait resolu ici.
      - name: Le build n'a pas touche aux dependances
        run: git diff --exit-code -- frontend/package.json frontend/package-lock.json

      - name: Rassembler les fichiers et leurs empreintes
        id: fichiers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp "build/libs/mars-visualizer-$VERSION.jar" release/mars-visualizer.jar
          cp config/application.properties release/application.properties
          cp deploy/mcv.service release/mcv.service
          cp deploy/nginx-mcv.conf release/nginx-mcv.conf
          cd release
          sha256sum mars-visualizer.jar application.properties mcv.service nginx-mcv.conf \
            | sed 's/  / */' > SHA256SUMS.txt
          {
            echo "### Empreintes SHA-256 de $VERSION"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Joindre les fichiers au run (essai)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcv-essai-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 7

      # Une seule attestation couvre les cinq fichiers : le JAR, ce qui
      # l'accompagne au deploiement, et la liste des empreintes elle-meme.
      - name: Attestation de provenance
        id: attestation
        if: inputs.release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/mars-visualizer.jar
            release/application.properties
            release/mcv.service
            release/nginx-mcv.conf
            release/SHA256SUMS.txt

      - name: Release en brouillon
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          # La preuve de provenance voyage AUSSI a cote des fichiers :
          # verifiable hors de GitHub, et c'est ce que lit OpenSSF Scorecard
          # (« Signed-Releases »).
          cp "$BUNDLE" "release/mcv-$TAG.sigstore.json"

          # Les notes : la section de CHANGELOG.md pour cette version, puis de
          # quoi verifier les fichiers.
          python3 - > "$RUNNER_TEMP/notes.md" <<'PY'
          import os, re
          version = os.environ["VERSION"]
          lignes = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          debut = next(i for i, l in enumerate(lignes)
                       if re.match(rf"^## v{re.escape(version)}(\s|$)", l))
          fin = next((i for i in range(debut + 1, len(lignes))
                      if lignes[i].startswith("## ")), len(lignes))
          print("\n".join(lignes[debut + 1:fin]).strip())
          PY
          {
            echo
            echo "### Verifying this release"
            echo
            echo "Built by GitHub Actions from this repository, with a signed build provenance attestation."
            echo "To check that a downloaded file comes from this repository and this workflow:"
            echo
            echo '```'
            echo "gh attestation verify mars-visualizer.jar --repo $GH_REPO"
            echo '```'
            echo
            echo "SHA-256 (\`sha256sum -c SHA256SUMS.txt\`):"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"

          # --target : le tag naitra sur le commit CONSTRUIT, a la publication.
          gh release create "$TAG" release/* \
            --draft --target "$GITHUB_SHA" \
            --title "Mars Climate Viewer $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
