# OpenSSF Scorecard : note les pratiques de securite du depot (actions
# epinglees, permissions des workflows, politique de securite, releases
# signees, dependances vulnerables...) et publie le detail dans l'onglet
# Security -> Code scanning. Chaque point faible y vient avec sa correction.
# C'est aussi ce qui alimente le badge du README.
#
# `publish_results: true` impose une forme stricte a ce fichier (runner
# ubuntu, permissions minimales, aucune variable d'environnement globale,
# actions d'une liste fermee) : le modifier au-dela des commentaires fait
# echouer la publication.
name: scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "30 6 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # deposer le rapport dans Code scanning
      id-token: write         # publier le score (badge, api.scorecard.dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
