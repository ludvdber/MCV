plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.mars'
// Un SNAPSHOT est par definition « pas encore publie » : une release ne peut
// pas en etre un. Meme numero que frontend/package.json, sinon deux versions
// coexistent dans un seul livrable.
version = '1.0.1'
description = 'Mars Climate Viewer'

// Tomcat force au-dessus de ce que fixe Spring Boot 4.1.1 (11.0.24). Le serveur
// est le composant expose a internet, et 11.0.22 a 11.0.24 portent trois
// failles CRITIQUES (GHSA-9xv2-5v5q-p794, GHSA-gcx9-497g-6cp6,
// GHSA-h3x4-894j-xpx5), corrigees en 11.0.25. Elles visent les mecanismes
// d'authentification DIGEST et FORM, que MCV n'utilise pas : le risque reel est
// faible, mais un serveur public ne tourne pas sur une version connue pour etre
// vulnerable. Retirer cette ligne des que Spring Boot fixe 11.0.25 ou plus.
//
// Dependabot ne les avait jamais signalees : le graphe de dependances de GitHub
// ne voyait AUCUNE dependance Java (936 paquets npm, 0 Maven) avant l'ajout de
// .github/workflows/dependency-submission.yml. Trouvees en interrogeant la base
// OSV avec le classpath resolu (58 dependances d'execution).
ext['tomcat.version'] = '11.0.25'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// Mockito chargé comme agent Java explicite (voir la tâche test).
	mockitoAgent
}

repositories {
	mavenCentral()
	// Repository UCAR pour NetCDF-Java
	maven {
		url = 'https://artifacts.unidata.ucar.edu/repository/unidata-all/'
	}
}

dependencies {
	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// NetCDF library (UCAR) - 5.9.1 = dernière stable et fonctionnelle
	implementation 'edu.ucar:cdm-core:5.10.0'

	// Guava - requis par cdm-core 5.9.1
	implementation 'com.google.guava:guava:33.7.1-jre'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// DevTools (rechargement automatique)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Même version que celle tirée par starter-test (gérée par le BOM Spring Boot),
	// isolée sans ses transitives pour servir uniquement d'agent -javaagent.
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.named('test') {
	useJUnitPlatform()
	// Charge Mockito comme agent au démarrage de la JVM de test : évite
	// l'auto-attachement déprécié de l'inline-mock-maker (sera interdit par le JDK).
	jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
	finalizedBy jacocoTestReport
}

// Couverture de tests : `./gradlew test` produit le rapport dans
// build/reports/jacoco/test/html/index.html (XML pour l'outillage CI).
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jar') {
	enabled = false
}

// ── Frontend build ──────────────────────────────────────────────────────
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCmd = isWindows ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	workingDir = file('frontend')
	commandLine npmCmd, 'install'
	inputs.file('frontend/package-lock.json')
	outputs.dir('frontend/node_modules')
}

tasks.register('buildFrontend', Exec) {
	dependsOn 'npmInstall'
	workingDir = file('frontend')
	commandLine npmCmd, 'run', 'build'
	inputs.dir('frontend/src')
	inputs.dir('frontend/public')
	inputs.file('frontend/index.html')
	inputs.file('frontend/vite.config.js')
	// Les dependances sont une entree du bundle au meme titre que le code :
	// fflate est embarque dans le fragment three.js. Sans ces deux lignes, une
	// mise a jour qui ne touche QUE les dependances (une correction de securite
	// Dependabot, typiquement) laissait cette tache « a jour » et le JAR
	// reembarquait l'ancien bundle, faille comprise.
	inputs.file('frontend/package.json')
	inputs.file('frontend/package-lock.json')
	outputs.dir('frontend/dist')
}

// Sync et NON Copy : une tache Copy n'efface rien, elle ajoute. Les fragments
// JavaScript de Vite portent une empreinte dans leur nom, donc chaque build en
// produit de nouveaux sans jamais reprendre les anciens, et le dossier
// empaquete grossissait a chaque fois. Mesure sur ce depot : 163 fichiers dans
// le JAR pour 55 reellement produits — 108 orphelins et 3,0 Mo de poids mort.
// Ce n'est pas qu'une question de taille : une page retiree du routeur restait
// SERVABLE a l'ancienne adresse de son fragment, ce qui est exactement ce
// qu'on ne veut pas quand on retire une page. Sync fait du dossier de
// destination le reflet exact de frontend/dist ; rien d'autre n'ecrit sous
// static/ (src/main/resources/static est vide).
tasks.register('copyFrontend', Sync) {
	dependsOn 'buildFrontend'
	from 'frontend/dist'
	into 'build/resources/main/static'
}

tasks.named('classes') {
	dependsOn 'copyFrontend'
}

// Le gabarit de configuration livre AVEC le JAR est le fichier
// config/application.properties du depot : une seule source, pas une copie a
// tenir a jour. Il entre dans le JAR sous un autre nom pour que Spring ne le
// charge pas comme configuration (seuls les application*.properties le sont) ;
// ConfigTemplateWriter le ressort a cote du JAR au premier demarrage quand
// aucune configuration externe n'est trouvee.
tasks.named('processResources') {
	from('config/application.properties') {
		rename { 'config-template.properties' }
	}
}

// Compilation avec flag -parameters pour Spring Boot
tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
    // Les sources portent des accents, y compris dans des messages destinés à la
    // console d'exploitation. Sans cette ligne, javac lit les fichiers avec
    // l'encodage par défaut de la MACHINE : le même dépôt compile en UTF-8 ici
    // et en windows-1252 ailleurs, et « répertoire » devient illisible dans le
    // JAR livré sans qu'aucun test ne le voie.
    options.encoding = 'UTF-8'
}