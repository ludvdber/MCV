# =============================================================================
# Mars Climate Viewer : configuration de deploiement / deployment configuration
# =============================================================================
# FR  A placer dans config/ a cote du JAR. Ce fichier surcharge les valeurs par
#     defaut du JAR : ne gardez que les lignes que vous changez.
#     Guide complet : DEPLOYMENT.fr.md
# EN  Goes in config/ next to the JAR. It overrides the JAR defaults: keep only
#     the lines you change. Full guide: DEPLOYMENT.md
#
#   mcv/
#     mars-visualizer.jar
#     config/
#       application.properties     <- ce fichier / this file
#
# Lancement / run :  java -jar mars-visualizer.jar
#
# Chaque cle a aussi une variable d'environnement (NETCDF_MEAN_PATH,
# NETCDF_INDIVIDUAL_PATH, SERVER_PORT...) qui L'EMPORTE sur ce fichier.
# Each key also has an environment variable, which WINS over this file.
# =============================================================================

# Surcharges locales de developpement, absentes en production : sans effet.
# Local developer overrides, absent in production: then simply ignored.
spring.config.import=optional:file:./config/application-local.properties

# Port HTTP / HTTP port
server.port=8080


# --- Les deux seules cles obligatoires / the only two required keys ----------
#
# Sous Windows, "\" est un caractere d'echappement dans un .properties :
# doublez-le, ou utilisez des slashes, y compris pour un partage reseau UNC
# (//serveur/partage/mars/mean).
# On Windows "\" escapes: double it, or use forward slashes, UNC included.

# Fichiers .nc moyennes, 48 pas d'heure locale
# Averaged .nc files, 48 local-time steps
netcdf.mean.path=/data/gem-mars/mean

# Un sous-dossier par annee martienne (34/, 35/...), fichiers a un seul pas
# One subfolder per Martian year, single-timestep files
netcdf.individual.path=/data/gem-mars/individual

# Premiere annee martienne presente ; les suivantes sont detectees seules
# First Martian year present; later ones are detected automatically
netcdf.individual.my_base=34


# --- Optionnel / optional ----------------------------------------------------

# Adresse publique du site : alimente sitemap.xml, robots.txt et les balises
# canonical / Open Graph. Laissee vide, elle est deduite de la requete, ce qui
# est deja juste derriere un reverse proxy. Doit porter http:// ou https:// et
# aucun slash final, sinon le demarrage echoue.
# Public address: fills sitemap.xml, robots.txt and the canonical tags. Empty,
# it is taken from the request. Needs a scheme and no trailing slash.
#site.public-url=https://mars.exemple.be

# Limites par IP et par minute / per-IP limits per minute
#ratelimit.requests-per-minute=120
#ratelimit.export-per-minute=20

# Proxys dont on croit le X-Forwarded-For, donc la facon dont MCV connait la
# vraie IP d'un visiteur. Le defaut couvre deja un proxy sur la meme machine,
# le meme reseau local ou le meme reseau Docker : n'y touchez que si le proxy
# est ailleurs. Details : DEPLOYMENT.fr.md
# Trusted proxies. The default already covers a local / LAN / Docker proxy.
#server.tomcat.remoteip.internal-proxies=127.0.0.1/32,::1/128,203.0.113.10/32

# Origine autorisee quand le frontend est servi a part. Inutile sinon : MCV
# sert sa propre interface, donc le navigateur appelle la meme origine.
# Allowed origin for a separately hosted frontend. Useless otherwise.
#cors.allowed-origin=https://mars.exemple.be

# Diagnostic verbeux au premier deploiement / verbose first-deployment logs
#logging.level.com.mars.visualizer=DEBUG

# En marche normale, MCV ecrit environ 7 lignes par visite : ce que le serveur
# a FAIT, jamais comment. Le detail des lectures NetCDF (fichier ouvert, taille)
# et les refus dus au client (format demande non servi, deconnexion en cours
# d'envoi) sont en DEBUG, parce qu'ils partaient a chaque requete sans rien
# apporter a l'exploitant. Les deux lignes ci-dessous les font revenir.
# Normal traffic writes about 7 log lines per visit. Per-read NetCDF details
# and client-caused refusals sit at DEBUG; the two lines below bring them back.
#logging.level.com.mars.visualizer.service.NetCDFReaderService=DEBUG
#logging.level.com.mars.visualizer.exception.GlobalExceptionHandler=DEBUG
