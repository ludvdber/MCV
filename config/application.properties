# =============================================================================
# Mars Climate Viewer (MCV) : deployment configuration
#                             configuration de deploiement
# =============================================================================
# EN  This file is read automatically if it sits in a "config/" folder next to
#     the JAR (or in the folder the JAR is launched from). It OVERRIDES the
#     defaults embedded in the JAR: keep only the lines you change.
#     Full guide: DEPLOYMENT.md
#
# FR  Ce fichier est lu automatiquement s'il se trouve dans un dossier
#     « config/ » a cote du JAR. Il SURCHARGE les valeurs par defaut du JAR :
#     ne gardez que les lignes que vous changez. Guide : DEPLOYMENT.fr.md
#
#   mcv/
#   ├── mars-visualizer.jar
#   └── config/
#       └── application.properties   <- this file / ce fichier
#
# Run / lancement :  java -jar mars-visualizer.jar
# Every property can also be set as an environment variable
# (NETCDF_MEAN_PATH, NETCDF_INDIVIDUAL_PATH, SERVER_PORT).
# =============================================================================

# ── Local developer overrides / surcharges locales de developpement ──────
# EN  Optional and not versioned: a developer keeps their own data paths in
#     config/application-local.properties instead of editing this template.
#     Absent in production, and then simply ignored.
# FR  Optionnel et non versionne : un developpeur garde ses propres chemins de
#     donnees dans config/application-local.properties plutot que de modifier
#     ce modele. Absent en production, la ligne est alors sans effet.
spring.config.import=optional:file:./config/application-local.properties

# ── HTTP port / port HTTP ────────────────────────────────────────────────────
# EN  Web interface and API are served on this port (http://server:8080).
# FR  L'interface web et l'API sont servies sur ce port.
server.port=8080

# ── MEAN NetCDF files / fichiers NetCDF MEAN ─────────────────────────────────
# EN  Folder with the averaged .nc files (48 local-time steps).
#     IMPORTANT on Windows: "\" is an escape character in .properties files.
#     Either double each backslash (\\\\server\\share\\mars\\mean) or simply
#     use forward slashes, which also work for UNC network shares:
#       //server/share/mars/mean
#
# FR  Dossier des fichiers .nc moyennes (48 pas d'heure locale).
#     IMPORTANT sous Windows : « \ » est un caractere d'echappement dans un
#     fichier .properties. Doublez chaque backslash ou utilisez des slashes,
#     y compris pour les partages reseau UNC.
#
# Examples / exemples :
#   Windows local disk      : netcdf.mean.path=D:/mars-data/mean
#   Windows network share   : netcdf.mean.path=//srv-iasb/gem-mars/mean
#   Linux local disk        : netcdf.mean.path=/data/gem-mars/mean
#   Linux NFS/CIFS mount    : netcdf.mean.path=/mnt/gem-mars/mean
netcdf.mean.path=/data/gem-mars/mean

# ── Individual NetCDF files / fichiers NetCDF individuels ────────────────────
# EN  Folder with one subfolder per Martian year (34/, 35/, ...), each holding
#     single-timestep .nc files. Same path rules as above.
# FR  Dossier avec un sous-dossier par annee martienne, memes regles d'ecriture.
netcdf.individual.path=/data/gem-mars/individual

# EN  First Martian year present in the individual/ folder (later years are
#     detected automatically).
# FR  Premiere annee martienne presente dans individual/ (les suivantes sont
#     detectees automatiquement).
netcdf.individual.my_base=34

# ── Per-IP request limits / limites de requetes par IP ───────────────────────
# EN  Basic abuse protection; tune for internal IASB usage if needed.
# FR  Protection basique contre les abus ; a ajuster si besoin.
#ratelimit.requests-per-minute=120
#ratelimit.export-per-minute=20

# ── Trusted proxies / proxys de confiance ──────────────────────────────────────
# EN  Which proxies MCV believes when they set X-Forwarded-For, i.e. how it
#     knows a visitor's real IP for the per-IP limits above. The default list
#     (loopback + private ranges) already covers Nginx or Caddy on the same
#     machine, the same LAN or the same Docker network: leave it alone.
#     Set it only if the proxy sits elsewhere (its address must be listed, or
#     every visitor shares one quota), or to narrow trust to the exact proxy
#     when MCV also stays reachable directly. Details: DEPLOYMENT.md
#
# FR  Les proxys dont MCV croit le X-Forwarded-For, c'est-a-dire la facon dont
#     il connait la vraie IP d'un visiteur pour les limites ci-dessus. La liste
#     par defaut (boucle locale + plages privees) couvre deja Nginx ou Caddy sur
#     la meme machine, le meme reseau local ou le meme reseau Docker : n'y
#     touchez pas. A renseigner seulement si le proxy est ailleurs (son adresse
#     doit y figurer, sinon tous les visiteurs partagent un seul quota), ou pour
#     restreindre la confiance au seul proxy si MCV reste aussi joignable en
#     direct. Details : DEPLOYMENT.fr.md
#server.tomcat.remoteip.internal-proxies=127.0.0.1/32,::1/128,203.0.113.10/32

# ── Cross-origin calls / appels inter-origine ────────────────────────────────
# EN  MCV serves its own web interface, so the browser calls the API on the SAME
#     origin and this setting never comes into play. It only matters when the
#     frontend is served separately: the Vite dev server, or a front end hosted
#     on another domain, which must then be named here.
#     Left unset, the value is http://localhost:5173 (the dev server). On a
#     public deployment that means a developer machine can call this API from a
#     browser. The data is public and read-only, no session or cookie is
#     involved and the per-IP limits still apply, so nothing is exposed that a
#     plain HTTP client could not already fetch. Set it to your own domain if
#     you would rather close it anyway.
#
# FR  MCV sert sa propre interface : le navigateur appelle donc l'API sur la
#     MEME origine, et ce reglage n'entre jamais en jeu. Il ne sert que si le
#     frontend est servi a part : le serveur de developpement Vite, ou une
#     interface hebergee sur un autre domaine, qu'il faut alors nommer ici.
#     Non renseigne, la valeur est http://localhost:5173 (le serveur de dev).
#     Sur un deploiement public, cela signifie qu'une machine de developpement
#     peut appeler cette API depuis un navigateur. Les donnees sont publiques et
#     en lecture seule, aucune session ni cookie n'intervient et les limites par
#     IP s'appliquent toujours : rien n'est expose qu'un simple client HTTP ne
#     puisse deja recuperer. Renseignez votre domaine si vous preferez fermer.
#
# Examples / exemples :
#   Same-origin only / meme origine seulement : cors.allowed-origin=https://mars.exemple.be
#   Separate frontend / frontend separe       : cors.allowed-origin=https://front.exemple.be
#cors.allowed-origin=https://mars.exemple.be

# ── Logging / journalisation ─────────────────────────────────────────────────
# EN  Uncomment for verbose diagnostics during the first deployment.
# FR  Decommentez pour un diagnostic verbeux au premier deploiement.
#logging.level.com.mars.visualizer=DEBUG
